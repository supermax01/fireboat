services:
  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: synthetic_database_only
      POSTGRES_DB: medplum
    command: ['postgres', '-c', 'default_transaction_isolation=REPEATABLE READ', '-c', 'shared_preload_libraries=pg_stat_statements,auto_explain']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - medplum-test-db:/var/lib/postgresql/data
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--requirepass', 'synthetic_redis_only']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'synthetic_redis_only', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  medplum:
    image: medplum/medplum-server@sha256:2968c9aeb85d03968370855a5dc409a6f28ef5abda0996e353be06c525b61216
    command: ['env']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:18103:8103'
    environment:
      MEDPLUM_PORT: 8103
      MEDPLUM_BASE_URL: http://127.0.0.1:18103/
      MEDPLUM_APP_BASE_URL: http://127.0.0.1:18103/
      MEDPLUM_STORAGE_BASE_URL: http://127.0.0.1:18103/storage/
      MEDPLUM_DATABASE_HOST: postgres
      MEDPLUM_DATABASE_PORT: 5432
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: synthetic_database_only
      MEDPLUM_REDIS_HOST: redis
      MEDPLUM_REDIS_PORT: 6379
      MEDPLUM_REDIS_PASSWORD: synthetic_redis_only
      MEDPLUM_BINARY_STORAGE: file:./binary/
      MEDPLUM_EMAIL_PROVIDER: none
      MEDPLUM_REGISTER_ENABLED: 'false'
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_ID: 11111111-1111-4111-8111-111111111111
      MEDPLUM_DEFAULT_SUPER_ADMIN_CLIENT_SECRET: synthetic_bootstrap_only_never_use_for_real_data
      MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: synthetic-admin@example.invalid
      MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: synthetic_bootstrap_password_only
volumes:
  medplum-test-db:
