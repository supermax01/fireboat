[project]
name = "fbgold"
version = "0.1.0"
description = "Second, independent gold-answer implementation for the fireboat benchmark."
requires-python = "==3.13.18"
dependencies = []

[project.scripts]
fbgold = "fbgold.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbgold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
